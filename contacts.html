<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Details</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

h2 {
font-size: 32px;
font-weight: bold;
margin-bottom: 30px;
text-align: center;
}

.grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 25px;
justify-items: center;
width: 100%;
max-width: 400px;
}

.card {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
width: 120px;
height: 120px;
border-radius: 20px;
background: linear-gradient(145deg, #ff0080, #7928ca);
color: #fff;
font-size: 22px;
text-decoration: none;
transition: transform 0.2s, box-shadow 0.2s;
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
cursor: pointer;
position: relative;
opacity: 0;
transform: translateY(50px);
animation: slideIn 0.5s forwards;
}

.card:nth-child(1) { animation-delay: 0.2s; }
.card:nth-child(2) { animation-delay: 0.4s; }
.card:nth-child(3) { animation-delay: 0.6s; }
.card:nth-child(4) { animation-delay: 0.8s; }

@keyframes slideIn {
to { opacity: 1; transform: translateY(0); }
}

.card:hover {
transform: scale(1.15);
box-shadow: 0 0 20px rgba(255,0,128,0.7), 0 0 30px rgba(121,40,202,0.5);
}

.card img {
width: 60px;
margin-bottom: 10px;
}

.card span {
font-size: 18px;
font-weight: bold;
}

.back-btn {
margin-top: 40px;
padding: 16px 40px;
background: #007bff;
color: white;
border-radius: 12px;
border: none;
cursor: pointer;
font-size: 20px;
transition: 0.25s;
}

.back-btn:hover {
background: #0056b3;
transform: scale(1.05);
}
</style>

</head>
<body>

<h2>CONTACT DETAILS</h2>

<div class="grid">

  <!-- CALL -->
  <div class="card" onclick="handleClick('tel:+919444210661')">
    <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png">
    <span>Call</span>
  </div>

  <!-- WHATSAPP -->
  <div class="card" onclick="handleClick('https://wa.me/919444210661?text=Hello%20I%20am%20interested%20in%20your%20products')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
    <span>WhatsApp</span>
  </div>

  <!-- INSTAGRAM -->
  <div class="card" onclick="handleClick('https://www.instagram.com/anu.3dprints')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
    <span>Instagram</span>
  </div>

  <!-- EMAIL -->
  <div class="card" onclick="sendMail()">
    <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
    <span>Email</span>
  </div>

</div>

<button class="back-btn" onclick="location.href='index.html'">BACK</button>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

<script>
// For Call, WhatsApp, Instagram
function handleClick(url) {
    if (navigator.vibrate) navigator.vibrate(100);
    document.getElementById('clickSound').play();

    if (url.startsWith('http')) {
        window.open(url, '_blank');
    } else {
        window.location.href = url;
    }
}

// For Email ONLY (this MUST open directly)
function sendMail() {
    window.location.href =
      "mailto:anu.3dprints@gmail.com?subject=Product%20Enquiry&body=Hello,%20I%20am%20interested%20in%20your%20products.%20Please%20share%20details.";
}
</script>

</body>
</html>
