<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Information</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
        background: #f8f8f8;
    }

    /* Top Gradient Border */
    .top-border {
        width: 100%;
        height: 10px;
        background: linear-gradient(to right, #ff1493, #a200ff);
    }

    h1 {
        margin-top: 20px;
        font-size: 32px;
        font-weight: bold;
    }

    h2 {
        font-size: 22px;
        margin-top: 10px;
        margin-bottom: 25px;
    }

    /* Contact Buttons Grid */
    .container {
        display: grid;
        grid-template-columns: repeat(2, 150px);
        justify-content: center;
        gap: 25px;
    }

    .btn-box {
        width: 150px;
        height: 150px;
        background: linear-gradient(135deg, #ff1493, #8a2be2);
        border-radius: 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        transition: transform 0.2s;
        cursor: pointer;
        color: white;
        font-weight: bold;
        text-decoration: none;
    }

    .btn-box:hover {
        transform: scale(1.07);
    }

    .btn-box img {
        width: 55px;
        margin-bottom: 10px;
    }

    /* Back Button */
    .back-btn {
        margin-top: 40px;
        padding: 12px 30px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        transition: 0.3s;
    }

    .back-btn:hover {
        background: #0056b3;
    }

    .bottom-border {
        width: 100%;
        height: 10px;
        background: linear-gradient(to right, #ff1493, #a200ff);
        margin-top: 40px;
    }
</style>
</head>
<body>

<div class="top-border"></div>

<h1>CONTACT INFORMATION</h1>
<h2>HI, HOW CAN I HELP YOU?</h2>

<div class="container">

    <!-- CALL -->
    <a class="btn-box" href="tel:+919876543210">
        <img src="https://img.icons8.com/ios-filled/100/ffffff/phone.png" alt="Call">
        Call
    </a>

    <!-- WHATSAPP -->
    <a class="btn-box" href="https://wa.me/919876543210">
        <img src="https://img.icons8.com/color/96/whatsapp.png" alt="WhatsApp">
        WhatsApp
    </a>

    <!-- INSTAGRAM -->
    <a class="btn-box" href="https://instagram.com/yourprofile">
        <img src="https://img.icons8.com/fluency/96/instagram-new.png" alt="Instagram">
        Instagram
    </a>

    <!-- EMAIL -->
    <a class="btn-box" href="mailto:youremail@gmail.com">
        <img src="https://img.icons8.com/fluency/96/gmail.png" alt="Email">
        Email
    </a>
</div>

<button class="back-btn" onclick="history.back()">BACK</button>

<div class="bottom-border"></div>

</body>
</html>
